name: Unify report warehouse cards
on:
  push:
    branches: [dev]
    paths: [.github/workflows/report-warehouse-card-once.yml, scripts/report-warehouse-card-staging/**, scripts/check-report-warehouse.mjs, src/modules/reports/components/ReportWarehouseCard*, src/modules/reports/components/report-warehouse-card.css]
permissions:
  contents: write
concurrency:
  group: report-warehouse-card-once
  cancel-in-progress: true
jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APP_ENV: test
      VITE_APP_TITLE: WMS Hoa Nam
      VITE_APP_VERSION: 1.0.0-report-warehouse
      VITE_API_BASE_URL: http://127.0.0.1:5197/api/v1
      VITE_API_HEALTH_PATH: /health
      VITE_API_TIMEOUT_MS: '10000'
      VITE_API_WITH_CREDENTIALS: 'true'
      VITE_STORAGE_URL: ''
      VITE_ENABLE_ANALYTICS: 'false'
      VITE_ENABLE_DEBUG: 'false'
      VITE_ENABLE_PERF_MONITOR: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies and Chromium
        run: |
          yarn install --frozen-lockfile --non-interactive > /tmp/warehouse-install.log 2>&1 || { tail -40 /tmp/warehouse-install.log; exit 1; }
          npx playwright install --with-deps chromium > /tmp/warehouse-browser.log 2>&1 || { tail -40 /tmp/warehouse-browser.log; exit 1; }
      - name: Capture the original inbound card before any report integration changes
        run: WAREHOUSE_BASELINE=1 node scripts/check-report-warehouse.mjs
      - name: Capture existing report tests
        run: |
          npm run test -- src/modules/reports src/app/layouts src/shared/i18n --maxWorkers=2 > /tmp/warehouse-before.log 2>&1 || true
          test -f test-results/vitest-results.json
          cp test-results/vitest-results.json /tmp/warehouse-before.json
          tail -12 /tmp/warehouse-before.log
      - name: Replace only warehouse header presentation using guarded source edits
        run: |
          node scripts/report-warehouse-card-staging/apply.mjs
          git diff --name-only -- src/modules/reports | grep -E '\.(ts|tsx|css)$' > /tmp/warehouse-changed
          cat /tmp/warehouse-changed | xargs node_modules/.bin/prettier --write
          node_modules/.bin/prettier --write src/modules/reports/components/ReportWarehouseCard.tsx src/modules/reports/components/ReportWarehouseCard.test.tsx src/modules/reports/components/report-warehouse-card.css scripts/check-report-warehouse.mjs
          git diff --check
      - name: TypeScript and warehouse identity, status and translation tests
        run: |
          npm run typecheck
          npm run test -- src/modules/reports/components/ReportWarehouseCard.test.tsx --maxWorkers=2
      - name: Compare original inbound geometry and all report warehouse cards
        run: node scripts/check-report-warehouse.mjs
      - name: Compare reports, shell and language tests against the unchanged baseline
        run: |
          npm run test -- src/modules/reports src/app/layouts src/shared/i18n --maxWorkers=2 > /tmp/warehouse-after.log 2>&1 || true
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('/tmp/warehouse-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('test-results/vitest-results.json','utf8'));
          const names=r=>r.testResults.flatMap(s=>(s.assertionResults||[]).filter(t=>t.status==='failed').map(t=>s.name+' :: '+t.fullName)).sort();
          const previous=new Set(names(before));const newFailures=names(after).filter(n=>!previous.has(n));
          console.log(JSON.stringify({baseline:{total:before.numTotalTests,passed:before.numPassedTests,failed:before.numFailedTests},updated:{total:after.numTotalTests,passed:after.numPassedTests,failed:after.numFailedTests},newFailures}));
          assert(after.numTotalTests>=before.numTotalTests,'Tests unexpectedly disappeared');
          assert.deepEqual(newFailures,[],'New report regressions');
          assert.equal(after.numRuntimeErrorTestSuites||0,0);
          JS
      - name: Preserve topbar controls
        run: node scripts/check-report-topbar.mjs
      - name: Production build
        run: |
          npm run build > /tmp/warehouse-build.log 2>&1 || { tail -80 /tmp/warehouse-build.log; exit 1; }
          tail -5 /tmp/warehouse-build.log
      - name: Publish validated warehouse cards directly to dev and clean temporary tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git add -- src/modules/reports/components src/modules/reports/inventory-flow/InboundFlowReport.tsx src/modules/reports/inventory-flow/OutboundFlowReport.tsx src/modules/reports/stock-reconcile/StockReconcileReport.tsx src/modules/reports/movement-trace/MovementTraceReport.tsx src/modules/reports/recipient-agency/RecipientAgencyReport.tsx src/modules/reports/io-history/IoHistoryReport.tsx src/modules/reports/io-history/rpt08/controls.tsx src/modules/reports/import-match/ImportQualityBaseline.tsx src/modules/reports/packing-label/PackingLabelPrintReport.tsx src/modules/reports/warranty-components/WarrantyComponentsReport.tsx scripts/check-report-warehouse.mjs
          git rm -r -- scripts/report-warehouse-card-staging .github/workflows/report-warehouse-card-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(reports): unify warehouse cards with the inbound report reference' -m 'Use one read-only warehouse card with matched geometry, icon, type, colors and right-aligned placement. Resolve the warehouse identity and status from existing scoped API data; never assume active. Preserve all report queries, filters, export handlers and global shell controls. Validate against the original inbound rendering and cross-report browser checks.'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/dev
          git rev-parse HEAD
