name: Non-report API safety validation
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/nonreport-api-safety.yml']
permissions:
  contents: write
concurrency:
  group: nonreport-api-safety
  cancel-in-progress: true
env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-nonreport-audit
  VITE_API_BASE_URL: http://127.0.0.1:5197/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: '10000'
  VITE_API_WITH_CREDENTIALS: 'true'
  VITE_STORAGE_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'
  VITE_ENABLE_DEBUG: 'false'
  VITE_ENABLE_PERF_MONITOR: 'false'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive > /tmp/install.log 2>&1 || { tail -40 /tmp/install.log; exit 1; }
      - name: Capture safety-module baseline
        run: |
          npm run test -- src/modules/auth src/modules/reverse src/modules/warranty --maxWorkers=2 > /tmp/before.log 2>&1 || true
          test -f test-results/vitest-results.json || { tail -60 /tmp/before.log; exit 1; }
          cp test-results/vitest-results.json /tmp/before.json
      - name: Apply reviewed candidate without changing a branch
        run: |
          node scripts/nonreport-api-audit/patch.mjs
          node scripts/nonreport-api-audit/patch-extra.mjs
          node scripts/nonreport-api-audit/patch-flows.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';import cp from 'node:child_process';import crypto from 'node:crypto';import assert from 'node:assert/strict';import ts from 'typescript';
          const changed=new Set(JSON.parse(fs.readFileSync('/tmp/nonreport-changed.json','utf8')));
          function load(p,sha){const original=cp.execFileSync('git',['show','HEAD:'+p],{encoding:'utf8'});const hash=crypto.createHash('sha1').update('blob '+Buffer.byteLength(original)+'\0').update(original).digest('hex');assert.equal(hash,sha,'Concurrent source change: '+p);return fs.readFileSync(p,'utf8');}
          function rep(s,a,b,n=1){assert.equal(s.split(a).length-1,n,'Anchor: '+a);return s.replaceAll(a,b);}
          function parse(s){return ts.createSourceFile('source.ts',s,ts.ScriptTarget.Latest,true);}
          function edits(s,predicate,replacement,count){const sf=parse(s),nodes=[];const visit=n=>{if(predicate(n,sf)){nodes.push(n);return;}ts.forEachChild(n,visit);};visit(sf);assert.equal(nodes.length,count,'Unexpected AST matches');for(const n of nodes.sort((a,b)=>b.pos-a.pos))s=s.slice(0,n.getStart(sf))+replacement+s.slice(n.end);return s;}
          function put(p,s){assert(!p.includes('/reports/'));assert.equal(parse(s).parseDiagnostics.length,0);fs.writeFileSync(p,s);changed.add(p);console.log('API_ONLY_EDIT',p);}
          {
            const p='src/modules/auth/services/auth.service.ts';let s=load(p,'ed5c0ed51f7d6d15a828b29d7cff1bc5a332ef33');
            s=edits(s,(n,f)=>ts.isPropertyAssignment(n)&&n.name.getText(f)==='role'&&n.initializer.getText(f).startsWith('data.role ??'),'role: data.role ?? null',1);put(p,s);
            const t='src/modules/auth/types/me.types.ts';put(t,rep(load(t,'ab33401c1a3a91049e556906197d7a557e2f44ff'),'role: MeRole;','role: MeRole | null;'));
          }
          {
            const p='src/modules/reverse/services/reversalService.ts';let s=load(p,'b78b9a038527bfadcc5f09095d4e6a6a231a419d');
            s='import { requiredApiNumber, requiredApiState } from "@/shared/api/api-read-values";\n'+s;
            s=edits(s,n=>ts.isFunctionDeclaration(n)&&n.name?.text==='num','function num(value: unknown): number { return requiredApiNumber(value, "reversal.quantity"); }',1);
            s=rep(s,'status: (text(row.status) as ReversalDocument["status"]) || "DRAFT",','status: requiredApiState(row.status, "reversal.status", ["DRAFT", "POSTED", "CANCELLED"]),');
            s=rep(s,'status: (text(row.status) as ReversalLine["status"]) || "DRAFT",','status: requiredApiState(row.status, "reversal.line.status", ["DRAFT", "POSTED", "CANCELLED"]),');
            s=edits(s,(n,f)=>ts.isPropertyAssignment(n)&&n.name.getText(f)==='can_reverse','can_reverse: row.can_reverse === true',2);
            s=rep(s,'return { "If-Match": String(version) };','return { "If-Match": String(requirePositiveNumber(version, "If-Match")) };');put(p,s);
          }
          {
            const p='src/modules/warranty/services/componentIssueService.ts';let s=load(p,'8b16713c48677c25af8317b1c76f25b94f6d6aea');
            s='import { requiredApiNumber, requiredApiState } from "@/shared/api/api-read-values";\n'+s;
            s=edits(s,n=>ts.isFunctionDeclaration(n)&&n.name?.text==='num','function num(value: unknown): number { return requiredApiNumber(value, "component_issue.quantity"); }',1);
            s=rep(s,'status: text(row.status, "ACTIVE") as ComponentIssueItem["status"],','status: requiredApiState(row.status, "component_issue.item.status", ["ACTIVE", "REMOVED", "POSTED"]),');
            s=rep(s,'status: text(document.status, "DRAFT") as ComponentIssueStatus,','status: requiredApiState(document.status, "component_issue.status", ["DRAFT", "SCANNING", "POSTED", "CANCELLED"]),');
            s=rep(s,'version: num(document.version) || 1,','version: requiredApiNumber(document.version, "component_issue.version"),');
            for(const state of ['SCANNING','CANCELLED','POSTED'])s=rep(s,`status: text(row.status, "${state}") as ComponentIssueStatus,`,'status: requiredApiState(row.status, "component_issue.status", ["DRAFT", "SCANNING", "POSTED", "CANCELLED"]),');
            put(p,s);
          }
          fs.writeFileSync('/tmp/nonreport-changed.json',JSON.stringify([...changed]));
          cp.execFileSync('node_modules/.bin/prettier',['--write',...changed],{stdio:'inherit'});
          JS
          git diff --check
          test -z "$(git diff --name-only -- src/modules/reports)"
      - name: Typecheck all consumers
        run: npm run typecheck
      - name: Compare safety-module regressions
        run: |
          rm -f test-results/vitest-results.json
          npm run test -- src/modules/auth src/modules/reverse src/modules/warranty --maxWorkers=2 > /tmp/after.log 2>&1 || true
          test -f test-results/vitest-results.json || { tail -60 /tmp/after.log; exit 1; }
          python3 - <<'PY'
          import json
          b=json.load(open('/tmp/before.json'));a=json.load(open('test-results/vitest-results.json'))
          def failed(r): return {(s['name'],t['fullName']):t for s in r['testResults'] for t in s.get('assertionResults',[]) if t['status']=='failed'}
          bf=failed(b);af=failed(a);new=set(af)-set(bf)
          for label,r in [('BASELINE',b),('CANDIDATE',a)]: print(label,{k:r.get(k) for k in ['numTotalTests','numPassedTests','numFailedTests','numRuntimeErrorTestSuites']})
          for key,t in af.items(): print('NEW_FAILURE' if key in new else 'EXISTING_FAILURE',key,str(t.get('failureMessages',[]))[:2500])
          if (a.get('numRuntimeErrorTestSuites') or 0)>(b.get('numRuntimeErrorTestSuites') or 0) or new: raise SystemExit(1)
          PY
      - name: Build candidate
        run: npm run build > /tmp/build.log 2>&1 || { tail -80 /tmp/build.log; exit 1; }
      - name: Prepare candidate tree without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import cp from 'node:child_process';import assert from 'node:assert/strict';
          const paths=JSON.parse(fs.readFileSync('/tmp/nonreport-changed.json','utf8'));assert(paths.every(p=>p.startsWith('src/')&&!p.includes('/reports/')));
          const base=cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/trees`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({base_tree:base,tree:paths.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}))})});
          if(!r.ok)throw Error(`Git tree creation failed: ${r.status}`);const tree=await r.json();console.log('SAFETY_CANDIDATE_TREE',JSON.stringify({tree:tree.sha,parent:process.env.GITHUB_SHA,paths}));cp.execFileSync('git',['diff','--stat'],{stdio:'inherit'});
          JS
