name: WWHN-292 FE Closure

on:
  push:
    branches:
      - m1
    paths:
      - "src/**"
      - "e2e/wwhn-292-ui-responsive-rbac.spec.ts"
      - "docs/Task_docs_Jira/WWHN-292.md"
      - "docs/evidence/wwhn-292/**"
      - "scripts/verify-wwhn-292-closure.mjs"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/wwhn-292-fe-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wwhn-292-fe-closure-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_APP_ENV: controlled-ci
  VITE_APP_VERSION: wwhn-292-ci.${{ github.run_number }}.${{ github.run_attempt }}
  VITE_API_BASE_URL: http://127.0.0.1:5173/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: "10000"
  VITE_API_WITH_CREDENTIALS: "true"
  VITE_STORAGE_URL: ""
  VITE_ENABLE_ANALYTICS: "false"
  VITE_ENABLE_DEBUG: "false"
  VITE_ENABLE_PERF_MONITOR: "false"
  SOURCE_SHA: ${{ github.sha }}

jobs:
  fe-closure:
    name: Exact-SHA UI responsive RBAC closure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Verify formatting without mutating source
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Verify API mapping
        run: npm run check:api-mapping

      - name: Run unit and integration tests
        run: npm run test

      - name: Verify WWHN-292 task-specific source controls
        run: npm run wwhn-292:verify

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run task-specific controlled UI responsive RBAC evidence
        run: npm run test:e2e:wwhn-292

      - name: Capture immutable exact-SHA evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="evidence/wwhn-292"
          mkdir -p "$evidence_dir"

          sha256sum \
            docs/Task_docs_Jira/WWHN-292.md \
            docs/evidence/wwhn-292/WWHN-292_CLOSURE_REGISTER.json \
            scripts/verify-wwhn-292-closure.mjs \
            e2e/wwhn-292-ui-responsive-rbac.spec.ts \
            package.json \
            > "$evidence_dir/SHA256SUMS"

          printf '%s\n' "$GITHUB_SHA" > "$evidence_dir/EXACT_GIT_SHA"
          printf '%s\n' "$GITHUB_RUN_ID" > "$evidence_dir/GITHUB_RUN_ID"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$evidence_dir/GITHUB_RUN_ATTEMPT"
          printf '%s\n' "m1" > "$evidence_dir/CANONICAL_BRANCH"
          printf '%s\n' "FE_CONTROLLED_NOT_UAT" > "$evidence_dir/EVIDENCE_CLASS"
          printf '%s\n' "created only after all prior source and controlled-runtime gates pass" > "$evidence_dir/GATE_SEMANTICS"

      - name: Upload immutable WWHN-292 FE evidence
        uses: actions/upload-artifact@v4
        with:
          name: wwhn-292-fe-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence/wwhn-292/**
            docs/Task_docs_Jira/WWHN-292.md
            docs/evidence/wwhn-292/WWHN-292_CLOSURE_REGISTER.json
            test-results/wwhn-292/**
            playwright-report/**
            dist/build-manifest.json
