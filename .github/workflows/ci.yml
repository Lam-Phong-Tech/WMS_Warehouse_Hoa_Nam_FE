name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - m1

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile --non-interactive
          elif [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::error::Repository must contain yarn.lock or package-lock.json for deterministic installs."
            exit 1
          fi

      - name: Generate Prettier patch for repository cleanup
        shell: bash
        run: |
          npm run format
          git diff --binary > prettier.patch

      - name: Upload Prettier patch
        uses: actions/upload-artifact@v4
        with:
          name: prettier-patch-${{ github.sha }}
          path: prettier.patch
          if-no-files-found: error
          retention-days: 7

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Verify env and smoke contract
        run: npm run env:verify

      - name: Verify UAT P0/P1 readiness contract
        run: npm run uat:p0p1:verify

      - name: Verify Master/SKU closure contract
        run: npm run master-sku:verify

      - name: Build
        run: npm run build

      - name: Check frontend health artifact
        run: npm run health:check

      - name: Check API mapping
        run: npm run check:api-mapping
