name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - m1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXECUTION_SHA: ${{ github.sha }}
  WMS_EVIDENCE_DIR: docs/evidence/wms-contract-signoff/generated
  WWHN_144_EVIDENCE_DIR: test-results/wwhn-144/${{ github.event.pull_request.head.sha || github.sha }}
  WWHN_175_EVIDENCE_DIR: test-results/wwhn-175/${{ github.event.pull_request.head.sha || github.sha }}
  WWHN_178_EVIDENCE_DIR: test-results/wwhn-178/${{ github.event.pull_request.head.sha || github.sha }}
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
  VITE_API_BASE_URL: http://127.0.0.1:5173/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: "10000"
  VITE_API_WITH_CREDENTIALS: "true"
  VITE_STORAGE_URL: ""
  VITE_ENABLE_ANALYTICS: "false"
  VITE_ENABLE_DEBUG: "false"
  VITE_ENABLE_PERF_MONITOR: "false"

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        id: install
        shell: bash
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check formatting without mutating source
        id: format
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Unit and integration tests
        id: unit_tests
        continue-on-error: true
        run: npm run test

      - name: Verify env and versioned health contract
        id: env_contract
        continue-on-error: true
        run: npm run env:verify

      - name: Verify UAT P0/P1 readiness contract
        id: uat_contract
        continue-on-error: true
        run: npm run uat:p0p1:verify

      - name: Verify WWHN-175 foundation closure controls
        id: wwhn_175
        continue-on-error: true
        run: npm run wwhn-175:verify

      - name: Verify WWHN-165 auth session closure controls
        id: wwhn_165
        continue-on-error: true
        run: npm run wwhn-165:verify

      - name: Verify WWHN-156 closure controls
        id: wwhn_156
        continue-on-error: true
        run: npm run wwhn-156:verify

      - name: Validate QA1 smoke contract without runtime secrets
        id: smoke_contract
        continue-on-error: true
        run: >-
          npm run smoke:wwhn-156 --
          --contract-only
          --env ci
          --source-sha "$SOURCE_SHA"
          --api-base-url "$VITE_API_BASE_URL"
          --health-path "$VITE_API_HEALTH_PATH"

      - name: Verify Master/SKU closure contract
        id: master_sku
        continue-on-error: true
        run: npm run master-sku:verify

      - name: Validate WWHN-178 direct API authorization evidence contract
        id: wwhn_178_rbac_contract
        continue-on-error: true
        env:
          WWHN_178_ENV: CI
          WWHN_178_EVIDENCE_DIR: docs/evidence/wwhn-178/generated/${{ env.SOURCE_SHA }}
        run: npm run wwhn-178:rbac:contract

      - name: Verify WMS P0/P1/P2 contract guards
        id: wms_contract
        continue-on-error: true
        env:
          WMS_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          WMS_EXECUTION_SHA: ${{ env.EXECUTION_SHA }}
        run: npm run wms-contract:verify

      - name: Verify WWHN-148 FE closure
        id: wwhn_148
        continue-on-error: true
        run: npm run wwhn-148:verify

      - name: Verify WWHN-144 closure contract
        id: wwhn_144
        continue-on-error: true
        run: npm run wwhn-144:verify

      - name: Build production bundle and immutable manifest
        id: build
        continue-on-error: true
        run: npm run build

      - name: Check frontend health artifact
        id: health
        continue-on-error: true
        run: npm run health:check

      - name: Check API mapping
        id: api_mapping
        continue-on-error: true
        run: npm run check:api-mapping

      - name: Install Playwright Chromium
        id: playwright_install
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Capture responsive auth/RBAC/API-error evidence
        id: runtime_evidence
        if: ${{ always() && steps.playwright_install.outcome == 'success' }}
        continue-on-error: true
        run: npm run test:e2e:evidence

      - name: Capture WWHN-144 QA2 evidence
        id: wwhn_144_e2e
        if: ${{ always() && steps.playwright_install.outcome == 'success' }}
        continue-on-error: true
        env:
          WWHN_144_EVIDENCE_DIR: ${{ env.WWHN_144_EVIDENCE_DIR }}
        run: npm run test:e2e:wwhn-144

      - name: Capture WWHN-175 responsive accessibility smoke evidence
        id: wwhn_175_e2e
        if: ${{ always() && steps.playwright_install.outcome == 'success' }}
        continue-on-error: true
        env:
          WWHN_175_EVIDENCE_DIR: ${{ env.WWHN_175_EVIDENCE_DIR }}
        run: npm run test:e2e:wwhn-175

      - name: Capture WWHN-178 Master/SKU QA2 evidence
        id: wwhn_178_e2e
        if: ${{ always() && steps.playwright_install.outcome == 'success' }}
        continue-on-error: true
        env:
          WWHN_178_EVIDENCE_DIR: ${{ env.WWHN_178_EVIDENCE_DIR }}
        run: npm run test:e2e:wwhn-178

      - name: Create WWHN-177 immutable DEV handoff
        id: wwhn_177_handoff
        if: ${{ always() && steps.build.outcome == 'success' && steps.health.outcome == 'success' }}
        continue-on-error: true
        env:
          DEV_APP_URL: ${{ vars.DEV_APP_URL }}
        run: npm run wwhn-177:handoff

      - name: Collect immutable CI/build/runtime manifest
        if: always()
        id: collect_evidence
        env:
          WMS_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          WMS_EXECUTION_SHA: ${{ env.EXECUTION_SHA }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          UNIT_TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          ENV_CONTRACT_OUTCOME: ${{ steps.env_contract.outcome }}
          UAT_CONTRACT_OUTCOME: ${{ steps.uat_contract.outcome }}
          WWHN_175_OUTCOME: ${{ steps.wwhn_175.outcome }}
          WWHN_165_OUTCOME: ${{ steps.wwhn_165.outcome }}
          WWHN_156_OUTCOME: ${{ steps.wwhn_156.outcome }}
          SMOKE_CONTRACT_OUTCOME: ${{ steps.smoke_contract.outcome }}
          MASTER_SKU_OUTCOME: ${{ steps.master_sku.outcome }}
          WWHN_178_RBAC_CONTRACT_OUTCOME: ${{ steps.wwhn_178_rbac_contract.outcome }}
          WMS_CONTRACT_OUTCOME: ${{ steps.wms_contract.outcome }}
          WWHN_148_OUTCOME: ${{ steps.wwhn_148.outcome }}
          WWHN_144_OUTCOME: ${{ steps.wwhn_144.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          API_MAPPING_OUTCOME: ${{ steps.api_mapping.outcome }}
          PLAYWRIGHT_INSTALL_OUTCOME: ${{ steps.playwright_install.outcome }}
          RUNTIME_EVIDENCE_OUTCOME: ${{ steps.runtime_evidence.outcome }}
          WWHN_144_E2E_OUTCOME: ${{ steps.wwhn_144_e2e.outcome }}
          WWHN_175_E2E_OUTCOME: ${{ steps.wwhn_175_e2e.outcome }}
          WWHN_178_E2E_OUTCOME: ${{ steps.wwhn_178_e2e.outcome }}
          WWHN_177_HANDOFF_OUTCOME: ${{ steps.wwhn_177_handoff.outcome }}
        run: npm run wms-evidence:collect

      - name: Upload WMS closure evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wms-fe-closure-evidence-${{ env.SOURCE_SHA }}
          path: |
            docs/Task_docs_Jira/WWHN-144.md
            docs/Task_docs_Jira/WWHN-165.md
            docs/Task_docs_Jira/WWHN-175.md
            docs/Task_docs_Jira/WWHN-178.md
            docs/api-evidence/WWHN-165_AUTH_CONTRACT_EXPECTATION.md
            docs/api-evidence/WWHN-178_MASTER_SKU_CONTRACT_BASELINE.json
            docs/evidence/wwhn-144
            docs/evidence/wwhn-165
            docs/evidence/wwhn-175
            docs/evidence/wwhn-178
            docs/evidence/wms-contract-signoff/generated
            docs/evidence/wwhn-156/WWHN-156_CLOSURE_REGISTER.json
            docs/evidence/wwhn-156/generated
            test-results
            playwright-report
            dist/health.json
            dist/build-manifest.json
            dist/index.html
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce all quality gate outcomes
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          UNIT_TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          ENV_CONTRACT_OUTCOME: ${{ steps.env_contract.outcome }}
          UAT_CONTRACT_OUTCOME: ${{ steps.uat_contract.outcome }}
          WWHN_175_OUTCOME: ${{ steps.wwhn_175.outcome }}
          WWHN_165_OUTCOME: ${{ steps.wwhn_165.outcome }}
          WWHN_156_OUTCOME: ${{ steps.wwhn_156.outcome }}
          SMOKE_CONTRACT_OUTCOME: ${{ steps.smoke_contract.outcome }}
          MASTER_SKU_OUTCOME: ${{ steps.master_sku.outcome }}
          WWHN_178_RBAC_CONTRACT_OUTCOME: ${{ steps.wwhn_178_rbac_contract.outcome }}
          WMS_CONTRACT_OUTCOME: ${{ steps.wms_contract.outcome }}
          WWHN_148_OUTCOME: ${{ steps.wwhn_148.outcome }}
          WWHN_144_OUTCOME: ${{ steps.wwhn_144.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          API_MAPPING_OUTCOME: ${{ steps.api_mapping.outcome }}
          PLAYWRIGHT_INSTALL_OUTCOME: ${{ steps.playwright_install.outcome }}
          RUNTIME_EVIDENCE_OUTCOME: ${{ steps.runtime_evidence.outcome }}
          WWHN_144_E2E_OUTCOME: ${{ steps.wwhn_144_e2e.outcome }}
          WWHN_175_E2E_OUTCOME: ${{ steps.wwhn_175_e2e.outcome }}
          WWHN_178_E2E_OUTCOME: ${{ steps.wwhn_178_e2e.outcome }}
          WWHN_177_HANDOFF_OUTCOME: ${{ steps.wwhn_177_handoff.outcome }}
        run: node scripts/assert-ci-gates.mjs

  dev-delivery:
    name: DEV delivery evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/m1'
    needs: quality-gates
    runs-on: ubuntu-latest
    environment:
      name: DEV
    env:
      SOURCE_SHA: ${{ github.sha }}
      DEV_APP_URL: ${{ vars.DEV_APP_URL }}
    steps:
      - name: Download exact closure artifact
        uses: actions/download-artifact@v4
        with:
          name: wms-fe-closure-evidence-${{ env.SOURCE_SHA }}
          path: delivery

      - name: Validate immutable DEV delivery package
        shell: bash
        run: |
          set -euo pipefail
          test -f delivery/dist/index.html
          test -f delivery/dist/health.json
          test -f delivery/dist/build-manifest.json
          test -f delivery/docs/evidence/wwhn-175/generated/WWHN-177_DEV_HANDOFF_MANIFEST.json
          mkdir -p dev-delivery
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const devAppUrl = (process.env.DEV_APP_URL ?? "").trim();
          const record = {
            schemaVersion: "1.0.0",
            task: "WWHN-177",
            sourceTask: "WWHN-175",
            sourceSha: process.env.SOURCE_SHA,
            environment: "DEV",
            githubEnvironmentStatus: "ACCEPTED",
            deliveryMode: devAppUrl
              ? "TARGET_CONFIGURED"
              : "NOT_CONFIGURED_ARTIFACT_ONLY",
            devAppUrl: devAppUrl || null,
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            generatedAt: new Date().toISOString(),
            liveRuntimeBoundary: devAppUrl
              ? "Target configured; DevOps must attach runtime health, smoke and rollback evidence."
              : "No live target configured; this record proves immutable artifact delivery only.",
          };
          writeFileSync(
            "dev-delivery/WWHN-177_DEV_ENVIRONMENT_RECORD.json",
            `${JSON.stringify(record, null, 2)}\n`,
          );
          NODE
          cp delivery/docs/evidence/wwhn-175/generated/WWHN-177_DEV_HANDOFF_MANIFEST.* dev-delivery/
          cp delivery/dist/health.json delivery/dist/build-manifest.json dev-delivery/

      - name: Publish DEV environment evidence
        uses: actions/upload-artifact@v4
        with:
          name: wwhn-177-dev-environment-evidence-${{ env.SOURCE_SHA }}
          path: dev-delivery
          if-no-files-found: error
          retention-days: 90
