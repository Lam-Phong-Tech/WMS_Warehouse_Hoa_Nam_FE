name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - m1

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json is missing; using npm install. Add and review a lockfile to restore deterministic installs."
            npm install --no-audit --no-fund --package-lock=false
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Verify env and smoke contract
        run: npm run env:verify

      - name: Verify UAT P0/P1 readiness contract
        run: npm run uat:p0p1:verify

      - name: Verify Master/SKU closure contract
        run: npm run master-sku:verify

      - name: Build
        run: npm run build

      - name: Check frontend health artifact
        run: npm run health:check

      - name: Check API mapping
        run: npm run check:api-mapping
