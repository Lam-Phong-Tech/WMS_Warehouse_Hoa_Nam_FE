name: One-off Prettier Remediation

on:
  push:
    branches:
      - m1
    paths:
      - ".github/workflows/one-off-prettier-remediation.yml"

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: m1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Format src with repository Prettier
        run: npx prettier --write "src/**/*.{ts,tsx,css}"

      - name: Commit formatting-only remediation
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -- src | tee /tmp/changed-files.txt
          test -s /tmp/changed-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "chore(format): remediate Prettier drift for exact-SHA CI"
          git push origin HEAD:m1
