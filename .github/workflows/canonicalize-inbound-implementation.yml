name: Canonicalize inbound implementation

on:
  push:
    branches: [m1]
    paths:
      - '.github/workflows/canonicalize-inbound-implementation.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1
          fetch-depth: 0
      - name: Move canonical implementation under inbound
        shell: bash
        run: |
          set -euo pipefail
          cp src/modules/receiving/services/receivingService.ts src/modules/inbound/services/inboundService.ts
          cat > src/modules/receiving/services/receivingService.ts <<'EOF'
          /** @deprecated Import from `@/modules/inbound/services/inboundService` for active code. */
          export * from "@/modules/inbound/services/inboundService";
          EOF
          cat > src/modules/receiving/types/index.ts <<'EOF'
          /** @deprecated Import inbound domain types from `@/modules/inbound/types`. */
          export * from "@/modules/inbound/types";
          EOF
          if grep -R '@\/modules\/receiving' src/modules/inbound --include='*.ts' --include='*.tsx'; then
            echo 'Active inbound module still depends on legacy receiving module'
            exit 1
          fi
      - name: Commit canonical ownership
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/inbound src/modules/receiving
          git commit -m "refactor(inbound): own canonical service implementation"
          git push origin HEAD:m1
