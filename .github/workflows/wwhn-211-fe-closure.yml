name: WWHN-211 FE Closure

on:
  push:
    branches:
      - m1
    paths:
      - "src/modules/inventory/**"
      - "src/app/router/access.ts"
      - "src/shared/api/endpoints.ts"
      - "docs/evidence/WWHN-211/**"
      - "scripts/verify-wwhn-211-closure.mjs"
      - "e2e/wwhn-212-inventory-qa2.spec.ts"
      - ".github/workflows/wwhn-211-fe-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
  VITE_API_BASE_URL: http://127.0.0.1:5173/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: "10000"
  VITE_API_WITH_CREDENTIALS: "true"
  VITE_STORAGE_URL: ""
  VITE_ENABLE_ANALYTICS: "false"
  VITE_ENABLE_DEBUG: "false"
  VITE_ENABLE_PERF_MONITOR: "false"

jobs:
  inventory-closure:
    name: Contract + QA2 runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Verify formatting without mutating source
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Verify exact six-endpoint FE contract and scope boundary
        run: node scripts/verify-wwhn-211-closure.mjs

      - name: Run WWHN-211 inventory unit/integration tests
        run: npx vitest run src/modules/inventory/services/inventoryService.test.ts

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run WWHN-212 runtime evidence matrix
        run: npx playwright test e2e/wwhn-212-inventory-qa2.spec.ts --project=chromium

      - name: Capture immutable exact-SHA evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="evidence/wwhn-211"
          mkdir -p "$evidence_dir"

          sha256sum \
            docs/evidence/WWHN-211/fe-contract-lock.json \
            src/modules/inventory/services/inventoryService.ts \
            src/modules/inventory/services/inventoryService.test.ts \
            src/modules/inventory/pages/InventoryPage.tsx \
            src/app/router/access.ts \
            src/shared/api/endpoints.ts \
            e2e/wwhn-212-inventory-qa2.spec.ts \
            scripts/verify-wwhn-211-closure.mjs \
            > "$evidence_dir/SHA256SUMS"

          printf '%s\n' "$GITHUB_SHA" > "$evidence_dir/EXACT_GIT_SHA"
          printf '%s\n' "$GITHUB_RUN_ID" > "$evidence_dir/GITHUB_RUN_ID"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$evidence_dir/GITHUB_RUN_ATTEMPT"
          printf '%s\n' "completed-by-workflow-only-after-all-prior-steps-pass" > "$evidence_dir/GATE_SEMANTICS"

      - name: Upload immutable WWHN-211/WWHN-212 FE evidence
        uses: actions/upload-artifact@v4
        with:
          name: wwhn-211-fe-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence/wwhn-211/**
            docs/evidence/WWHN-211/fe-contract-lock.json
            test-results/**
            playwright-report/**
            dist/build-manifest.json
