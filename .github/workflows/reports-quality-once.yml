name: Review live reports and controls
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/reports-quality-once.yml
      - scripts/reports-quality-staging/**
      - scripts/check-reports-live-controls.mjs
permissions:
  contents: write
concurrency:
  group: reports-quality-once
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APP_ENV: test
      VITE_APP_TITLE: WMS Hoa Nam
      VITE_APP_VERSION: 1.0.0-reports-quality
      VITE_API_BASE_URL: http://127.0.0.1:5199/api/v1
      VITE_API_HEALTH_PATH: /health
      VITE_API_TIMEOUT_MS: '10000'
      VITE_API_WITH_CREDENTIALS: 'true'
      VITE_STORAGE_URL: ''
      VITE_ENABLE_ANALYTICS: 'false'
      VITE_ENABLE_DEBUG: 'false'
      VITE_ENABLE_PERF_MONITOR: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies and Chromium
        run: |
          yarn install --frozen-lockfile --non-interactive > /tmp/reports-install.log 2>&1 || { tail -40 /tmp/reports-install.log; exit 1; }
          npx playwright install --with-deps chromium > /tmp/reports-browser-install.log 2>&1 || { tail -40 /tmp/reports-browser-install.log; exit 1; }
      - name: Capture baseline report tests before any application changes
        run: |
          npm run test -- src/modules/reports src/app/layouts src/shared/i18n --maxWorkers=2 > /tmp/reports-baseline.log 2>&1 || true
          test -f test-results/vitest-results.json
          cp test-results/vitest-results.json /tmp/reports-baseline.json
          tail -14 /tmp/reports-baseline.log
      - name: Apply reviewed controls, real API states and complete source paging
        run: |
          python3 scripts/reports-quality-staging/repair.py
          python3 scripts/reports-quality-staging/repair-reversal.py
          cp scripts/reports-quality-staging/io-history-api.integrity.test.tsx.txt src/modules/reports/io-history/io-history-api.integrity.test.tsx
          cp scripts/reports-quality-staging/reports-api-only.test.ts.txt src/modules/reports/reports-api-only.test.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-reports-live-controls.mjs')
          s=p.read_text().replace("/reports-live-controls-tmp/index.html');","/reports-live-controls-tmp/index.html?state=error&demo=true');")
          marker="  for(const language of ['vi','en']){"
          assert s.count(marker)==1
          s=s.replace(marker,"  assert.equal(await root.locator('.rpt08-overview-card__total .rpt08-big-number').innerText(),'6');\n  assert.equal(await root.locator('.rpt08-product-total strong').innerText(),'21');\n"+marker)
          p.write_text(s)
          PY
          git diff --name-only -- src/modules/reports | grep -E '\.(ts|tsx|css)$' > /tmp/report-changed-files
          git ls-files --others --exclude-standard src/modules/reports | grep -E '\.(ts|tsx|css)$' >> /tmp/report-changed-files
          sort -u /tmp/report-changed-files | xargs node_modules/.bin/prettier --write
          node_modules/.bin/prettier --write scripts/check-reports-live-controls.mjs
          git diff --check
      - name: TypeScript validation
        run: npm run typecheck
      - name: New dropdown, API-source and quantity-integrity tests must pass
        run: npm run test -- src/modules/reports/io-history/rpt08/SelectControl.test.tsx src/modules/reports/io-history/io-history-api.integrity.test.tsx src/modules/reports/reports-api-only.test.ts src/modules/reports/operations/report-reversal-source.test.ts --maxWorkers=2
      - name: Compare every report, shell and language test against baseline
        run: |
          npm run test -- src/modules/reports src/app/layouts src/shared/i18n --maxWorkers=2 > /tmp/reports-after.log 2>&1 || true
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('/tmp/reports-baseline.json','utf8'));
          const after=JSON.parse(fs.readFileSync('test-results/vitest-results.json','utf8'));
          const failures=r=>r.testResults.flatMap(s=>(s.assertionResults||[]).filter(t=>t.status==='failed').map(t=>({file:s.name.replace(process.cwd()+'/',''),name:t.fullName}))).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)));
          const oldNames=new Set(failures(before).map(f=>JSON.stringify(f)));
          const newFailures=failures(after).filter(f=>!oldNames.has(JSON.stringify(f)));
          const summary={baseline:{total:before.numTotalTests,passed:before.numPassedTests,failed:before.numFailedTests},updated:{total:after.numTotalTests,passed:after.numPassedTests,failed:after.numFailedTests},newFailures,remainingFailures:failures(after)};
          console.log(JSON.stringify(summary,null,2));
          fs.writeFileSync('test-results/reports-quality-tests.json',JSON.stringify(summary,null,2));
          assert.equal(before.numTotalTests,245,'Unexpected baseline; inspect before publishing');
          assert.equal(before.numFailedTests,26,'Unexpected baseline failures');
          assert(after.numTotalTests>=before.numTotalTests+23,'Missing regression tests');
          assert.deepEqual(newFailures,[],'New report regressions');
          assert.equal(after.numRuntimeErrorTestSuites||0,0,'Test suite runtime errors');
          JS
      - name: Read-only API responses, report geometry and smooth control interactions
        run: node scripts/check-reports-live-controls.mjs
      - name: Preserve global language, appearance and shortcut controls
        run: node scripts/check-report-topbar.mjs
      - name: Production build
        run: |
          npm run build > /tmp/reports-build.log 2>&1 || { tail -80 /tmp/reports-build.log; exit 1; }
          tail -5 /tmp/reports-build.log
      - name: Publish validated repair directly to dev and remove temporary tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git add -- src/modules/reports/io-history/io-history-report.css src/modules/reports/io-history/rpt08/SelectControl.tsx src/modules/reports/io-history/rpt08/SelectControl.test.tsx src/modules/reports/io-history/rpt08/controls.tsx src/modules/reports/io-history/rpt08/controls.css src/modules/reports/io-history/rpt08/base.css src/modules/reports/io-history/rpt08/table-states.css src/modules/reports/io-history/io-history-api.ts src/modules/reports/io-history/io-history-api.integrity.test.tsx src/modules/reports/io-history/rpt08/Rpt08HistoryReport.tsx src/modules/reports/warranty-components/WarrantyComponentsReport.tsx src/modules/reports/reports-api-only.test.ts src/modules/reports/operations/report-data.ts src/modules/reports/operations/report-reversal-source.ts src/modules/reports/operations/report-reversal-source.test.ts scripts/check-reports-live-controls.mjs
          git rm -r -- scripts/reports-quality-staging .github/workflows/reports-quality-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(reports): align history controls and enforce API-derived report data' -m 'Use shared operations colors, smooth non-reflowing dropdown transitions and keyboard navigation. Remove Warranty URL-forced fake states and fixed mockup dates. Preserve API null quantities; exclude cached sources outside the requested scope and wait for required report sources. Read all reversal pages or fail without partial totals. Validate real report components with intercepted API responses and compare all report tests to baseline; no live warehouse records modified.'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/dev
          git rev-parse HEAD
