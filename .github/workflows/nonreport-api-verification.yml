name: Non-report API verification
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nonreport-api-verification
  cancel-in-progress: true
env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-nonreport-audit
  VITE_API_BASE_URL: http://127.0.0.1:5197/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: '10000'
  VITE_API_WITH_CREDENTIALS: 'true'
  VITE_STORAGE_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'
  VITE_ENABLE_DEBUG: 'false'
  VITE_ENABLE_PERF_MONITOR: 'false'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install locked dependencies
        id: install
        run: yarn install --frozen-lockfile --non-interactive
      - name: Inspect committed runtime source and guard fixture imports
        run: |
          node scripts/nonreport-api-audit/inspect.mjs > /tmp/nonreport-inspection.jsonl
          node scripts/nonreport-api-audit/guard.mjs /tmp/nonreport-inspection.jsonl
          python3 - <<'PY'
          import json
          for line in open('/tmp/nonreport-inspection.jsonl'):
            row = json.loads(line)
            if row['kind'] == 'audit-totals':
              print(json.dumps(row))
          PY
      - name: Typecheck actual committed source
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Run non-report regression tests without suppressing failures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          rm -f test-results/vitest-results.json
          status=0
          npm run test -- src/modules src/shared/api src/shared/ui/catalog --exclude 'src/modules/reports/**' --maxWorkers=2 > /tmp/nonreport-tests.log 2>&1 || status=$?
          if test -f test-results/vitest-results.json; then
            python3 - <<'PY'
          import json
          result = json.load(open('test-results/vitest-results.json'))
          print('TEST_TOTALS', {key: result.get(key) for key in ['numTotalTests', 'numPassedTests', 'numFailedTests']})
          for suite in result.get('testResults', []):
            for test in suite.get('assertionResults', []):
              if test.get('status') == 'failed':
                print('FAILED', suite['name'], test['fullName'])
          PY
          else
            tail -60 /tmp/nonreport-tests.log
            exit 1
          fi
          exit "$status"
      - name: Build actual committed source
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
