name: Non-report API verification
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/nonreport-api-verification.yml', 'scripts/nonreport-api-audit/**']
permissions:
  contents: write
concurrency:
  group: nonreport-api-verification
  cancel-in-progress: true
env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-nonreport-audit
  VITE_API_BASE_URL: http://127.0.0.1:5197/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: '10000'
  VITE_API_WITH_CREDENTIALS: 'true'
  VITE_STORAGE_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'
  VITE_ENABLE_DEBUG: 'false'
  VITE_ENABLE_PERF_MONITOR: 'false'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive > /tmp/audit-install.log 2>&1 || { tail -40 /tmp/audit-install.log; exit 1; }
      - name: Inspect current runtime data sources
        run: |
          node scripts/nonreport-api-audit/inspect.mjs > /tmp/nonreport-before.jsonl
          python3 - <<'PY'
          import json,collections
          rows=[json.loads(x) for x in open('/tmp/nonreport-before.jsonl')]
          files=collections.defaultdict(set); overlays=collections.Counter(); queries=collections.Counter()
          for r in rows:
            p=r.get('path',''); parts=p.split('/'); module=parts[2] if p.startswith('src/modules/') else '/'.join(parts[:3])
            files[module].add(p)
            if r['kind']=='overlay': overlays[module]+=1
            if r['kind']=='api-query': queries[module]+=1
            if r['kind'] in ['audit-totals','literal-array']: print('AUDIT_BEFORE',json.dumps(r,ensure_ascii=False))
          print('AUDIT_MODULES',json.dumps({m:{'files':len(v),'overlays':overlays[m],'queries':queries[m]} for m,v in files.items()},ensure_ascii=False))
          PY
      - name: Capture existing non-report test baseline
        run: |
          npm run test -- src/modules/auth src/modules/dashboard src/modules/inbound src/modules/inventory src/modules/master-data src/modules/outbound src/modules/putaway src/modules/reversal src/modules/warranty src/shared/api src/shared/ui/catalog --maxWorkers=2 > /tmp/nonreport-baseline.log 2>&1 || true
          test -f test-results/vitest-results.json
          cp test-results/vitest-results.json /tmp/nonreport-baseline.json
      - name: Apply SHA-guarded candidate in the runner only
        id: patch
        run: |
          node scripts/nonreport-api-audit/patch.mjs
          node scripts/nonreport-api-audit/patch-extra.mjs
          if test -f scripts/nonreport-api-audit/patch-flows.mjs; then node scripts/nonreport-api-audit/patch-flows.mjs; fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';import cp from 'node:child_process';
          const files=JSON.parse(fs.readFileSync('/tmp/nonreport-changed.json','utf8'));
          cp.execFileSync('node_modules/.bin/prettier',['--write',...files],{stdio:'inherit'});
          JS
          git diff --check
          test -z "$(git diff --name-only -- src/modules/reports)"
      - name: Typecheck candidate and every consumer
        run: npm run typecheck
      - name: Compare affected regression results with baseline
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          npm run test -- src/modules/auth src/modules/dashboard src/modules/inbound src/modules/inventory src/modules/master-data src/modules/outbound src/modules/putaway src/modules/reversal src/modules/warranty src/shared/api src/shared/ui/catalog --maxWorkers=2 > /tmp/nonreport-candidate.log 2>&1 || true
          python3 - <<'PY'
          import json
          before=json.load(open('/tmp/nonreport-baseline.json')); after=json.load(open('test-results/vitest-results.json'))
          def failed(r):
            return {(s['name'],t['fullName']):t for s in r['testResults'] for t in s.get('assertionResults',[]) if t['status']=='failed'}
          bf=failed(before); af=failed(after); new=set(af)-set(bf)
          for name,result in [('BASELINE',before),('CANDIDATE',after)]: print(name,json.dumps({k:result.get(k) for k in ['numTotalTests','numPassedTests','numFailedTests','numRuntimeErrorTestSuites']}))
          for key,t in af.items(): print('NEW_FAILURE' if key in new else 'EXISTING_FAILURE',key,str(t.get('failureMessages',[]))[:1800])
          if after.get('numRuntimeErrorTestSuites',0)>before.get('numRuntimeErrorTestSuites',0) or new: raise SystemExit(1)
          PY
      - name: Inspect remaining read-model defaults
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          node scripts/nonreport-api-audit/inspect.mjs > /tmp/nonreport-after.jsonl
          python3 - <<'PY'
          import json
          for line in open('/tmp/nonreport-after.jsonl'):
            r=json.loads(line)
            if r['kind']=='audit-totals' or r['kind']=='literal-array' or r['kind']=='fallback-review' and ('/services/' in r['path'] or '/api/' in r['path']): print('AUDIT_AFTER',json.dumps(r,ensure_ascii=False))
          PY
      - name: Build candidate
        run: npm run build > /tmp/nonreport-build.log 2>&1 || { tail -80 /tmp/nonreport-build.log; exit 1; }
      - name: Prepare verified Git tree for review without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import cp from 'node:child_process';import assert from 'node:assert/strict';
          const paths=JSON.parse(fs.readFileSync('/tmp/nonreport-changed.json','utf8'));
          assert(paths.every(p=>p.startsWith('src/')&&!p.includes('/reports/')));
          const base=cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/trees`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({base_tree:base,tree:paths.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}))})});
          if(!response.ok)throw new Error(`Git tree creation failed: ${response.status}`);
          const result=await response.json();
          console.log('VERIFIED_CANDIDATE_TREE',JSON.stringify({tree:result.sha,parent:process.env.GITHUB_SHA,paths}));
          cp.execFileSync('git',['diff','--stat'],{stdio:'inherit'});
          JS
