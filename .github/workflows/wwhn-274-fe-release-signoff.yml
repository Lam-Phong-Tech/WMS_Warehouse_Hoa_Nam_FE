name: WWHN-274 FE Release Sign-off

# FE274-P1-01: gate nay phai chay duoc tren MOT commit chi dinh (workflow_dispatch +
# source_sha) chu khong chi tren HEAD cua push, de reviewer luon truy xuat duoc
# "run PASS + artifact" ung voi dung candidate SHA da pin trong docs/Jira.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact FE commit SHA can chay (de trong = SHA cua ref hien tai)"
        required: false
        type: string
      require_real_env:
        description: "Bat buoc chay real-env FE<->BE smoke (FE274-P1-06)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  fe-release-signoff:
    name: Exact-SHA build/config/UI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      VITE_APP_ENV: test
      VITE_API_BASE_URL: http://127.0.0.1:5173/api/v1
      VITE_API_WITH_CREDENTIALS: 'true'
      VITE_API_HEALTH_PATH: /health

    steps:
      # `fetch-depth: 0` la bat buoc cho che do chay lai theo SHA: input `ref` cua
      # actions/checkout KHONG nhan SHA rut gon (`76f2efd` -> git fetch that bai,
      # exit 1 ngay o buoc checkout), va mot shallow clone cung khong co commit cu de
      # checkout tiep. Lay du lich su roi tu resolve o buoc duoi la cach chay lai duoc
      # tren dung candidate SHA da pin trong Jira/tai lieu.
      - name: Checkout m1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin resolved source SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.source_sha }}"
          if [ -n "$REQUESTED" ]; then
            # Chap nhan ca SHA day du lan rut gon; rev-parse chuan hoa ve 40 hex.
            FULL="$(git rev-parse --verify "${REQUESTED}^{commit}")"
            git checkout --detach "$FULL"
          fi
          ACTUAL="$(git rev-parse HEAD)"
          if [ -n "$REQUESTED" ] && [ "${ACTUAL#"$REQUESTED"}" = "$ACTUAL" ]; then
            echo "Requested SHA $REQUESTED but checked out $ACTUAL" >&2
            exit 1
          fi
          # Evidence phai nam NGOAI outputDir cua Playwright: moi lenh `playwright test`
          # don sach test-results/ truoc khi chay, nen buoc E2E sau se xoa bang chung cua
          # buoc truoc va artifact chi con lai lan chay cuoi cung.
          EVIDENCE_BASE="docs/evidence/WWHN-274/generated/$ACTUAL"
          {
            echo "SOURCE_SHA=$ACTUAL"
            echo "VITE_APP_VERSION=wwhn-274-$ACTUAL"
            echo "WWHN_274_EVIDENCE_BASE=$EVIDENCE_BASE"
            echo "WWHN_274_EVIDENCE_DIR=$EVIDENCE_BASE/controlled"
            echo "WWHN_274_A11Y_EVIDENCE_DIR=$EVIDENCE_BASE/a11y"
            echo "WWHN_274_REAL_EVIDENCE_DIR=$EVIDENCE_BASE/real-env"
          } >> "$GITHUB_ENV"
          echo "sha=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "Triggering github.sha=${{ github.sha }} / resolved=$ACTUAL"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      # NFR-SRS-006 doi ca Chrome/Edge (Blink) lan Safari iOS (WebKit) => phai co ca hai engine.
      - name: Install browsers (Chromium + WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Verify WWHN-274 source contract
        run: npm run wwhn-274:verify

      - name: Format gate
        run: npm run format:check

      - name: Lint gate
        run: npm run lint

      - name: Typecheck gate
        run: npm run typecheck

      - name: Unit test gate
        run: npm run test

      - name: Environment contract gate
        run: npm run env:verify

      - name: API mapping gate
        run: npm run check:api-mapping

      - name: Production build
        run: npm run build

      - name: Built frontend health contract
        run: npm run health:check

      - name: WWHN-274 controlled responsive/RBAC/UI smoke
        run: npm run test:e2e:wwhn-274

      - name: WWHN-274 a11y + browser/device matrix (FE274-P2-03)
        run: npm run test:e2e:wwhn-274:a11y

      # FE274-P1-06: bang chung tich hop that. Chi chay khi co moi truong deploy that;
      # khi da chay thi fail-closed (REQUIRE_REAL_ENV=1) de khong bao gio "skip = PASS".
      - name: Real-environment FE<->BE smoke (FE274-P1-06)
        id: real_env
        if: ${{ vars.WWHN_274_REAL_BASE_URL != '' || inputs.require_real_env }}
        env:
          E2E_BASE_URL: ${{ vars.WWHN_274_REAL_BASE_URL }}
          WWHN_274_REAL_BASE_URL: ${{ vars.WWHN_274_REAL_BASE_URL }}
          WWHN_274_REAL_API_BASE_URL: ${{ vars.WWHN_274_REAL_API_BASE_URL }}
          WWHN_274_REAL_USER: ${{ secrets.WWHN_274_REAL_USER }}
          WWHN_274_REAL_PASSWORD: ${{ secrets.WWHN_274_REAL_PASSWORD }}
          WWHN_274_REQUIRE_REAL_ENV: '1'
          WWHN_274_REQUIRE_AUTHENTICATED: ${{ secrets.WWHN_274_REAL_USER != '' && '1' || '0' }}
        run: npm run test:e2e:wwhn-274:real-env

      - name: Write exact-SHA release sign-off manifest
        if: always()
        shell: bash
        env:
          REAL_ENV_OUTCOME: ${{ steps.real_env.outcome }}
        run: |
          mkdir -p "$WWHN_274_EVIDENCE_DIR"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.WWHN_274_EVIDENCE_DIR;
          const realEnvOutcome = process.env.REAL_ENV_OUTCOME || 'not-run';
          const payload = {
            ticket: 'WWHN-274',
            parent: 'WWHN-72',
            parentTempKey: 'HN-DEVOPS-003',
            evidenceClass: 'FE_CONTROLLED_NOT_QA_UAT',
            sourceSha: process.env.SOURCE_SHA,
            triggeringSha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            environment: process.env.VITE_APP_ENV,
            buildVersion: process.env.VITE_APP_VERSION,
            apiBaseUrl: process.env.VITE_API_BASE_URL,
            healthPath: process.env.VITE_API_HEALTH_PATH,
            browserMatrix: {
              requirement: 'NFR-SRS-006',
              projects: [
                'wwhn-274-desktop-chromium',
                'wwhn-274-chrome-android',
                'wwhn-274-safari-ios',
              ],
              coverageClass: 'ENGINE_EMULATION_NOT_REAL_DEVICE',
            },
            realEnvSmoke: {
              finding: 'FE274-P1-06',
              outcome: realEnvOutcome,
              executed: realEnvOutcome === 'success' || realEnvOutcome === 'failure',
              note:
                realEnvOutcome === 'success'
                  ? 'Real deployed FE<->BE smoke passed in this run.'
                  : 'Real-env smoke did NOT run in this run; controlled mocked evidence alone must not be quoted as FE<->BE integration proof.',
            },
            generatedAt: new Date().toISOString(),
            truthBoundary:
              'FE source-controlled build/config/UI smoke only; independent QA1, backend security and DevOps deploy/backup/rollback evidence remain role-owned.',
          };
          fs.writeFileSync(path.join(root, 'release-signoff.json'), `${JSON.stringify(payload, null, 2)}\n`);
          NODE

      - name: Upload WWHN-274 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wwhn-274-fe-release-signoff-${{ steps.sha.outputs.sha || github.sha }}
          path: |
            docs/evidence/WWHN-274/generated/${{ steps.sha.outputs.sha || github.sha }}/
            playwright-report/
            dist/build-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Release truth-boundary summary
        if: always()
        run: |
          echo '### WWHN-274 FE release sign-off' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact SHA: \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`wwhn-274-fe-release-signoff-$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API base: \`$VITE_API_BASE_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend health: \`$VITE_API_BASE_URL$VITE_API_HEALTH_PATH\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Coverage: build/config, shared UI states, responsive 1440x900/768x1024/375x812, permission menu + direct URL 403, controlled API 422/retry.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser/device matrix (NFR-SRS-006): Chromium desktop, Chrome Android emulation, Safari iOS WebKit; keyboard/focus/basic a11y.' >> "$GITHUB_STEP_SUMMARY"
          echo "- Real-env FE<->BE smoke (FE274-P1-06): \`${{ steps.real_env.outcome || 'not-run' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Boundary: this workflow is FE-controlled evidence, not independent QA1/UAT or DevOps deploy/backup/rollback evidence.' >> "$GITHUB_STEP_SUMMARY"
