name: Non-report API data audit
on:
  push:
    branches: [dev]
    paths: [.github/workflows/nonreport-api-audit-once.yml, scripts/nonreport-api-audit/**]
permissions:
  contents: read
concurrency:
  group: nonreport-api-data-audit
  cancel-in-progress: true
env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-nonreport-audit
  VITE_API_BASE_URL: http://127.0.0.1:5197/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: '10000'
  VITE_API_WITH_CREDENTIALS: 'true'
  VITE_STORAGE_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'
  VITE_ENABLE_DEBUG: 'false'
  VITE_ENABLE_PERF_MONITOR: 'false'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive > /tmp/audit-install.log 2>&1 || { tail -40 /tmp/audit-install.log; exit 1; }
      - name: Apply guarded changes only in the validation workspace
        id: patch
        run: |
          node scripts/nonreport-api-audit/patch.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';import cp from 'node:child_process';
          const files=JSON.parse(fs.readFileSync('/tmp/nonreport-changed.json','utf8'));
          cp.execFileSync('node_modules/.bin/prettier',['--write',...files],{stdio:'inherit'});
          JS
          git diff --check
          test -z "$(git diff --name-only -- src/modules/reports)"
      - name: Type check
        if: steps.patch.outcome == 'success'
        run: npm run typecheck
      - name: Capture affected regression results for review
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          npm run test -- src/modules/dashboard src/modules/inventory src/modules/master-data src/modules/outbound src/shared/api --maxWorkers=2 > /tmp/audit-updated.log 2>&1 || true
          python3 - <<'PY'
          import json
          p=json.load(open('test-results/vitest-results.json'))
          print('UPDATED_TESTS',json.dumps({k:p.get(k) for k in ['numTotalTests','numPassedTests','numFailedTests','numRuntimeErrorTestSuites']}))
          for s in p['testResults']:
           for t in s.get('assertionResults',[]):
            if t['status']=='failed':print('UPDATED_FAIL',s['name'],t['fullName'],str(t.get('failureMessages',[]))[:1700])
          PY
      - name: Inspect remaining read-model defaults
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          node scripts/nonreport-api-audit/inspect.mjs > /tmp/nonreport-after.jsonl
          python3 - <<'PY'
          import json
          rows=[json.loads(x) for x in open('/tmp/nonreport-after.jsonl')]
          for r in rows:
           if r['kind']=='audit-totals':print(json.dumps(r))
          PY
