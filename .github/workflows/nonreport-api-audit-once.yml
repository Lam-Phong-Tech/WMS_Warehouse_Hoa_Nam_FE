name: Non-report API data audit
on:
  push:
    branches: [dev]
    paths: [.github/workflows/nonreport-api-audit-once.yml, scripts/nonreport-api-audit/**]
permissions:
  contents: read
concurrency:
  group: nonreport-api-data-audit
  cancel-in-progress: true
env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-nonreport-audit
  VITE_API_BASE_URL: http://127.0.0.1:5197/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: '10000'
  VITE_API_WITH_CREDENTIALS: 'true'
  VITE_STORAGE_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'
  VITE_ENABLE_DEBUG: 'false'
  VITE_ENABLE_PERF_MONITOR: 'false'
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive > /tmp/audit-install.log 2>&1 || { tail -40 /tmp/audit-install.log; exit 1; }
      - name: AST inventory of all runtime source files outside reports
        run: |
          node scripts/nonreport-api-audit/inspect.mjs > /tmp/nonreport-audit.jsonl
          python3 - <<'PY'
          import json,collections,re
          rows=[json.loads(x) for x in open('/tmp/nonreport-audit.jsonl')]
          print('COUNTS',json.dumps(dict(collections.Counter(x['kind'] for x in rows))))
          for r in rows:
           if r['kind'] in ['audit-totals','literal-array','jsx-fixed-value','jsx-literal-text'] or r['kind']=='domain-literal' and '/services/' in r['path']:
            print(json.dumps(r,ensure_ascii=False))
          print('FALLBACK_REVIEW')
          for r in rows:
           if r['kind']=='fallback-review' and not re.search(r'per_page|pageSize|page_size|last_page|pagination|params.page|sortOrder|sort_order|sortDir|thumbnail|printCount|thresholdSeconds|offset|pageLimit',r['text']):print(json.dumps(r,ensure_ascii=False))
          print('MODAL_SITES',json.dumps([{'path':r['path'],'line':r['line'],'node':r['text'].split()[0]} for r in rows if r['kind']=='overlay']))
          print('SERVICE_FILES',json.dumps(sorted(set(r['path'] for r in rows if r['kind']=='api-query'))))
          PY
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive > /tmp/audit-install.log 2>&1 || { tail -40 /tmp/audit-install.log; exit 1; }
      - name: Run existing tests without mutating application data
        run: |
          npm run test -- src/modules/auth src/modules/dashboard src/modules/iam src/modules/inbound src/modules/inventory src/modules/master-data src/modules/notifications src/modules/outbound src/modules/putaway src/modules/pv src/modules/reverse src/modules/scan src/modules/warranty src/shared/api src/shared/cache src/shared/store src/app/router --maxWorkers=2 > /tmp/audit-baseline.log 2>&1 || true
          python3 - <<'PY'
          import json
          p=json.load(open('test-results/vitest-results.json'))
          print('BASELINE',json.dumps({k:p.get(k) for k in ['numTotalTests','numPassedTests','numFailedTests','numRuntimeErrorTestSuites']}))
          for s in p['testResults']:
           for t in s.get('assertionResults',[]):
            if t['status']=='failed':print('BASELINE_FAIL',s['name'],t['fullName'],str(t.get('failureMessages',[]))[:800])
          PY
