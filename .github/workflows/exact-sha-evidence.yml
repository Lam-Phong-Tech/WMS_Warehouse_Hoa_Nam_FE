name: Exact SHA FE Evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact FE commit SHA to verify"
        required: true
        type: string
      run_pwa_gate:
        description: "Run WWHN-325 Chromium PWA gate when the test exists"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-exact-sha.${{ github.run_number }}.${{ github.run_attempt }}
  VITE_API_BASE_URL: http://127.0.0.1:5173/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: "10000"
  VITE_API_WITH_CREDENTIALS: "true"
  VITE_STORAGE_URL: ""
  VITE_ENABLE_ANALYTICS: "false"
  VITE_ENABLE_DEBUG: "false"
  VITE_ENABLE_PERF_MONITOR: "false"

jobs:
  exact-sha-evidence:
    name: Exact SHA quality/runtime evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact requested source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify immutable source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          REQUESTED="${{ inputs.source_sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          printf '%s\n' "$REQUESTED" > ci-evidence/requested-source-sha.txt
          printf '%s\n' "$ACTUAL" > ci-evidence/actual-source-sha.txt
          if [ "$ACTUAL" != "$REQUESTED" ]; then
            echo "Requested SHA $REQUESTED but checked out $ACTUAL" >&2
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-evidence
          yarn install --frozen-lockfile --non-interactive 2>&1 | tee ci-evidence/install.log
          code=${PIPESTATUS[0]}
          echo "$code" > ci-evidence/install.exit-code
          exit "$code"

      - name: Format check
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee ci-evidence/format-check.log
          code=${PIPESTATUS[0]}
          echo "$code" > ci-evidence/format-check.exit-code
          exit "$code"

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ci-evidence/lint.log
          code=${PIPESTATUS[0]}
          echo "$code" > ci-evidence/lint.exit-code
          exit "$code"

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-evidence/typecheck.log
          code=${PIPESTATUS[0]}
          echo "$code" > ci-evidence/typecheck.exit-code
          exit "$code"

      - name: Unit and integration tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee ci-evidence/unit-integration.log
          code=${PIPESTATUS[0]}
          echo "$code" > ci-evidence/unit-integration.exit-code
          exit "$code"

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-evidence/production-build.log
          code=${PIPESTATUS[0]}
          echo "$code" > ci-evidence/production-build.exit-code
          exit "$code"

      - name: Health artifact check
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run health:check 2>&1 | tee ci-evidence/health-check.log
          code=${PIPESTATUS[0]}
          echo "$code" > ci-evidence/health-check.exit-code
          exit "$code"

      - name: API mapping check
        id: api_mapping
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:api-mapping 2>&1 | tee ci-evidence/api-mapping.log
          code=${PIPESTATUS[0]}
          echo "$code" > ci-evidence/api-mapping.exit-code
          exit "$code"

      - name: Install Chromium
        id: chromium_install
        if: ${{ inputs.run_pwa_gate }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee ci-evidence/chromium-install.log
          code=${PIPESTATUS[0]}
          echo "$code" > ci-evidence/chromium-install.exit-code
          exit "$code"

      - name: Chromium WWHN-325 PWA runtime gate
        id: pwa
        if: ${{ inputs.run_pwa_gate && steps.chromium_install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f e2e/wwhn-325-pwa-offline.spec.ts ]; then
            echo "PWA evidence test not present at requested source SHA" | tee ci-evidence/pwa-runtime.log
            echo "125" > ci-evidence/pwa-runtime.exit-code
            exit 125
          fi
          npx playwright test e2e/wwhn-325-pwa-offline.spec.ts --project=chromium 2>&1 | tee ci-evidence/pwa-runtime.log
          code=${PIPESTATUS[0]}
          echo "$code" > ci-evidence/pwa-runtime.exit-code
          exit "$code"

      - name: Write exact-SHA evidence manifest
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          API_MAPPING_OUTCOME: ${{ steps.api_mapping.outcome }}
          CHROMIUM_INSTALL_OUTCOME: ${{ steps.chromium_install.outcome }}
          PWA_OUTCOME: ${{ steps.pwa.outcome }}
        run: |
          mkdir -p ci-evidence
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, writeFileSync } from "node:fs";
          const read = (path) => existsSync(path) ? readFileSync(path, "utf8").trim() : null;
          const manifest = {
            schemaVersion: "1.0.0",
            requestedSourceSha: "${{ inputs.source_sha }}",
            actualSourceSha: read("ci-evidence/actual-source-sha.txt"),
            workflowDefinitionSha: "${{ github.sha }}",
            workflowRunId: "${{ github.run_id }}",
            workflowRunAttempt: "${{ github.run_attempt }}",
            workflowRunUrl: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            nodeVersion: "22",
            environmentContract: {
              VITE_APP_ENV: process.env.VITE_APP_ENV,
              VITE_API_BASE_URL: process.env.VITE_API_BASE_URL,
              VITE_API_HEALTH_PATH: process.env.VITE_API_HEALTH_PATH,
              VITE_API_TIMEOUT_MS: process.env.VITE_API_TIMEOUT_MS,
              VITE_API_WITH_CREDENTIALS: process.env.VITE_API_WITH_CREDENTIALS,
            },
            gates: {
              install: { outcome: process.env.INSTALL_OUTCOME, exitCode: read("ci-evidence/install.exit-code") },
              format: { outcome: process.env.FORMAT_OUTCOME, exitCode: read("ci-evidence/format-check.exit-code") },
              lint: { outcome: process.env.LINT_OUTCOME, exitCode: read("ci-evidence/lint.exit-code") },
              typecheck: { outcome: process.env.TYPECHECK_OUTCOME, exitCode: read("ci-evidence/typecheck.exit-code") },
              unitIntegration: { outcome: process.env.TEST_OUTCOME, exitCode: read("ci-evidence/unit-integration.exit-code") },
              productionBuild: { outcome: process.env.BUILD_OUTCOME, exitCode: read("ci-evidence/production-build.exit-code") },
              health: { outcome: process.env.HEALTH_OUTCOME, exitCode: read("ci-evidence/health-check.exit-code") },
              apiMapping: { outcome: process.env.API_MAPPING_OUTCOME, exitCode: read("ci-evidence/api-mapping.exit-code") },
              chromiumInstall: { outcome: process.env.CHROMIUM_INSTALL_OUTCOME, exitCode: read("ci-evidence/chromium-install.exit-code") },
              pwaRuntime: { outcome: process.env.PWA_OUTCOME, exitCode: read("ci-evidence/pwa-runtime.exit-code") },
            },
            generatedAt: new Date().toISOString(),
          };
          writeFileSync("ci-evidence/exact-sha-evidence-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          sha256sum ci-evidence/* dist/health.json dist/build-manifest.json dist/index.html 2>/dev/null > ci-evidence/SHA256SUMS || true

      - name: Upload exact-SHA artifact and raw command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-fe-evidence-${{ inputs.source_sha }}
          path: |
            ci-evidence
            dist/health.json
            dist/build-manifest.json
            dist/index.html
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce required exit-code-zero gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          required=(
            ci-evidence/install.exit-code
            ci-evidence/format-check.exit-code
            ci-evidence/lint.exit-code
            ci-evidence/typecheck.exit-code
            ci-evidence/unit-integration.exit-code
            ci-evidence/production-build.exit-code
            ci-evidence/health-check.exit-code
            ci-evidence/api-mapping.exit-code
          )
          for file in "${required[@]}"; do
            test -f "$file"
            test "$(cat "$file")" = "0"
          done
          if [ "${{ inputs.run_pwa_gate }}" = "true" ]; then
            test -f ci-evidence/chromium-install.exit-code
            test "$(cat ci-evidence/chromium-install.exit-code)" = "0"
            test -f ci-evidence/pwa-runtime.exit-code
            test "$(cat ci-evidence/pwa-runtime.exit-code)" = "0"
          fi
