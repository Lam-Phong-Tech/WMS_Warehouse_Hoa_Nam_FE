name: Coordinated loading verification
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/loading-sync-verification.yml'
      - 'vitest.config.ts'
      - 'src/shared/ui/loading/**'
      - 'src/shared/ui/use-tab-view*'
      - 'src/shared/ui/components/UiDialog.tsx'
      - 'src/shared/ui/components/UiStateSurface.tsx'
      - 'src/shared/components/ui-states/PageSkeleton.tsx'
      - 'src/shared/components/data-display/**'
      - 'src/shared/components/feedback/**'
      - 'src/shared/components/charts/**'
      - 'src/modules/reports/**'
      - 'src/modules/dashboard/**'
      - 'src/modules/putaway/**'
      - 'src/app/router/**'
permissions:
  contents: read
concurrency:
  group: loading-sync-dev
  cancel-in-progress: true
env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-loading-sync
  VITE_API_BASE_URL: http://127.0.0.1:5197/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: '10000'
  VITE_API_WITH_CREDENTIALS: 'true'
  VITE_STORAGE_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'
  VITE_ENABLE_DEBUG: 'false'
  VITE_ENABLE_PERF_MONITOR: 'false'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Loading, chart, transition and report-refresh regressions
        run: npm run test -- src/shared/ui/loading src/shared/ui/use-tab-view.test.tsx src/shared/components/charts src/modules/reports/operations/report-refresh --maxWorkers=2
      - name: Existing chart consumer regressions
        if: ${{ !cancelled() }}
        run: npm run test -- src/test/report-tables-column-align.test.tsx src/test/reports-operations-tabs-smoke.test.tsx src/modules/reports/import-match/ImportMatchReport.test.tsx src/modules/reports/recipient-agency/AgencyComparisonTab.test.tsx src/modules/putaway/components/TraySelectionGrid.test.tsx --maxWorkers=2
      - name: Typecheck the committed application
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Build the committed application
        if: ${{ !cancelled() }}
        run: npm run build
