name: Fix DEV handoff gate

on:
  push:
    branches: [m1]
    paths:
      - '.github/workflows/fix-dev-handoff-gate.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1
          fetch-depth: 0
      - name: Make handoff gate fail-closed instead of skip
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = "        if: ${{ always() && steps.build.outcome == 'success' && steps.health.outcome == 'success' }}\n        continue-on-error: true\n        env:\n          DEV_APP_URL: ${{ vars.DEV_APP_URL }}\n        run: npm run wwhn-177:handoff\n"
          new = "        if: ${{ always() }}\n        continue-on-error: true\n        env:\n          DEV_APP_URL: ${{ vars.DEV_APP_URL }}\n        run: npm run wwhn-177:handoff\n"
          if old not in text:
              raise SystemExit('Expected WWHN-177 handoff condition not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm -f .github/workflows/fix-dev-handoff-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git commit -m 'fix(ci): fail closed on WWHN-177 handoff evidence'
          git push origin HEAD:m1
