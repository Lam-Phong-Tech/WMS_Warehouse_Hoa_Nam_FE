name: Validate RPT08 report alignment
on:
  push:
    branches: [dev]
    paths: [.github/workflows/align-rpt08-once.yml]
permissions:
  contents: write
concurrency:
  group: align-rpt08-once
  cancel-in-progress: false
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_APP_ENV: test
      VITE_APP_TITLE: WMS Hoa Nam
      VITE_APP_VERSION: 1.0.0-rpt08-align
      VITE_API_BASE_URL: http://127.0.0.1:5198/api/v1
      VITE_API_HEALTH_PATH: /health
      VITE_API_TIMEOUT_MS: '10000'
      VITE_API_WITH_CREDENTIALS: 'true'
      VITE_STORAGE_URL: ''
      VITE_ENABLE_ANALYTICS: 'false'
      VITE_ENABLE_DEBUG: 'false'
      VITE_ENABLE_PERF_MONITOR: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies and Chromium
        run: |
          yarn install --frozen-lockfile --non-interactive > /tmp/rpt08-install.log 2>&1 || { tail -40 /tmp/rpt08-install.log; exit 1; }
          npx playwright install --with-deps chromium > /tmp/rpt08-browser-install.log 2>&1 || { tail -40 /tmp/rpt08-browser-install.log; exit 1; }
      - name: Preserve contrast within the newly themed cards and capture local previews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path('src/modules/reports/io-history/rpt08/alignment.css')
          css.write_text(css.read_text() + '''
          /* The card palette follows the current theme; its inset surfaces must too. */
          #rpt08-history-report .rpt08-donut::before { background: var(--ops-surface); }
          #rpt08-history-report .rpt08-product-breakdown > span,
          #rpt08-history-report .rpt08-unit-row small,
          #rpt08-history-report .rpt08-table-heading h2 > span {
            background: var(--ops-pale); color: var(--ops-link);
          }
          #rpt08-history-report .rpt08-chart-legend,
          #rpt08-history-report .rpt08-y-axis,
          #rpt08-history-report .rpt08-bar-group > small,
          #rpt08-history-report .rpt08-panel-heading > div:first-child > span,
          #rpt08-history-report .rpt08-donut-side,
          #rpt08-history-report .rpt08-overview-breakdown > div,
          #rpt08-history-report .rpt08-overview-breakdown small,
          #rpt08-history-report .rpt08-unit-row,
          #rpt08-history-report .rpt08-product-total span { color: var(--ops-muted); }
          #rpt08-history-report .rpt08-code-cell strong { color: var(--ops-heading); }
          ''')
          script = Path('scripts/check-rpt08-layout.mjs')
          source = script.read_text()
          marker = '          cases++;'
          assert source.count(marker) == 1
          source = source.replace(marker, '''          if ((width === 1920 && sidebar === 300) || (width === 800 && theme === 'light')) {
            await fs.mkdir('test-results/rpt08-layout', {recursive:true});
            await page.locator('#rpt08-history-report').screenshot({path:'test-results/rpt08-layout/'+language+'-'+theme+'-'+width+'.png', animations:'disabled'});
          }
          cases++;''')
          source = source.replace("            const issues = [];", """            const issues = [];
            const donut = root.querySelector('.rpt08-donut');
            const card = root.querySelector('.rpt08-activity-card');
            if(getComputedStyle(donut, '::before').backgroundColor !== getComputedStyle(card).backgroundColor)issues.push('donut inset theme mismatch');""")
          script.write_text(source)
          PY
          node_modules/.bin/prettier --write src/modules/reports/io-history/rpt08/alignment.css scripts/check-rpt08-layout.mjs
          git diff --check
      - name: History, shell and language regression tests
        run: |
          npm run test -- src/modules/reports/io-history src/app/layouts src/shared/i18n --maxWorkers=2 > /tmp/rpt08-tests.log 2>&1 || { tail -160 /tmp/rpt08-tests.log; exit 1; }
          tail -14 /tmp/rpt08-tests.log
      - name: Real report geometry and interaction checks in Chromium
        run: node scripts/check-rpt08-layout.mjs
      # Artifact storage quota is exhausted. Screenshots remain an optional local
      # output; no test or build gate depends on uploading binary artifacts.
      - name: Production build including TypeScript
        run: |
          npm run build > /tmp/rpt08-build.log 2>&1 || { tail -80 /tmp/rpt08-build.log; exit 1; }
          tail -5 /tmp/rpt08-build.log
      - name: Publish validated polish and remove completed one-time tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git add -- src/modules/reports/io-history/rpt08/alignment.css scripts/check-rpt08-layout.mjs
          git rm -- scripts/apply-rpt08-layout.py .github/workflows/align-rpt08-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(reports): finalize aligned history layout and themed card contrast' -m 'Retain common title and right-aligned pagination, scoped responsive layout and all business handlers. Verified 123 focused tests and 48 Chromium geometry cases across seven widths, VI/EN and light/dark themes; production build passed. Remove only completed temporary migration tooling.'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/dev
          git rev-parse HEAD
