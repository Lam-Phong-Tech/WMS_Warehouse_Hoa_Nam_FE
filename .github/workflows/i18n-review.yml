name: Localization source review

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/i18n-review.yml'
      - 'scripts/*localiz*.mjs'
      - 'scripts/i18n-reviewed-translations*.tsv'
      - 'src/shared/i18n/**'

permissions:
  contents: read

concurrency:
  group: localization-source-review-dev
  cancel-in-progress: true

env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-i18n
  VITE_API_BASE_URL: http://127.0.0.1:5173/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: '10000'
  VITE_API_WITH_CREDENTIALS: 'true'
  VITE_STORAGE_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'
  VITE_ENABLE_DEBUG: 'false'
  VITE_ENABLE_PERF_MONITOR: 'false'

jobs:
  review:
    if: github.repository == 'Lam-Phong-Tech/WMS_Warehouse_Hoa_Nam_FE' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive > /tmp/i18n-install.log 2>&1 || { tail -40 /tmp/i18n-install.log; exit 1; }
      - name: Apply and audit reviewed interface translations
        run: |
          cat scripts/i18n-reviewed-translations-css.tsv >> scripts/i18n-reviewed-translations-extra.tsv
          node scripts/prepare-localization.mjs
      - name: Format changed source only
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const changed = execFileSync('git',['diff','--name-only','-z']).toString().split('\0');
          const added = execFileSync('git',['ls-files','--others','--exclude-standard','-z']).toString().split('\0');
          const files = [...new Set([...changed,...added])].filter(p=>p.startsWith('src/') && /\.(ts|tsx|css)$/.test(p) && fs.existsSync(p));
          if(files.length) execFileSync('node_modules/.bin/prettier',['--write',...files],{stdio:'ignore'});
          execFileSync('git',['diff','--check','--','src'],{stdio:'inherit'});
          JS
      - name: Type check
        run: npm run typecheck > /tmp/i18n-types.log 2>&1 || { cat /tmp/i18n-types.log; exit 1; }
      - name: Compare language and warehouse tests with the pre-task baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-localization.mjs
      - name: Production build
        run: npm run build > /tmp/i18n-build.log 2>&1 || { tail -80 /tmp/i18n-build.log; exit 1; }
      - name: Publish validated UI changes directly to dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = 'Lam-Phong-Tech/WMS_Warehouse_Hoa_Nam_FE'
          test "$GITHUB_REF" = 'refs/heads/dev'
          gh auth setup-git
          remote_sha="$(git ls-remote origin refs/heads/dev | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA" || { echo 'dev changed during validation; no changes were pushed.'; exit 1; }
          git add -- src
          if git diff --cached --quiet; then echo 'No unpublished UI changes.'; exit 0; fi
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const tests=JSON.parse(fs.readFileSync('/tmp/localization-validation.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('i18n-migration-review.json','utf8'));
          fs.writeFileSync('/tmp/i18n-commit.txt',`fix(i18n): complete English interface copy across warehouse screens\n\nTranslate ${audit.translatedOccurrences} fixed UI occurrences with ${audit.newMessages} new message pairs.\nTypecheck and production build passed.\nTests: ${tests.passed}/${tests.total} passed; ${tests.preExistingFailures} identical existing failures verified against ${tests.baseline}; no new failures.\nPreserve identifiers, API values and user-entered content.\n`);
          JS
          git commit -F /tmp/i18n-commit.txt
          git push origin HEAD:refs/heads/dev
          git rev-parse HEAD
