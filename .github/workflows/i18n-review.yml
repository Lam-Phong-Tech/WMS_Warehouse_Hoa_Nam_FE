name: Localization source review

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/i18n-review.yml'
      - 'scripts/*localiz*.mjs'
      - 'scripts/i18n-reviewed-translations.tsv'
      - 'src/shared/i18n/**'

permissions:
  contents: read

concurrency:
  group: localization-source-review-dev
  cancel-in-progress: true

env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-i18n
  VITE_API_BASE_URL: http://127.0.0.1:5173/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: '10000'
  VITE_API_WITH_CREDENTIALS: 'true'
  VITE_STORAGE_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'
  VITE_ENABLE_DEBUG: 'false'
  VITE_ENABLE_PERF_MONITOR: 'false'

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive > /tmp/i18n-install.log 2>&1 || { tail -40 /tmp/i18n-install.log; exit 1; }
      - name: Apply and audit reviewed interface translations
        run: node scripts/prepare-localization.mjs
      - name: Type check
        run: npm run typecheck > /tmp/i18n-types.log 2>&1 || { cat /tmp/i18n-types.log; exit 1; }
      - name: Focused language switching regression tests
        if: ${{ !cancelled() }}
        run: |
          npm run test -- src/shared/i18n src/modules/reports/io-history/IoHistoryFeedback.locale.test.tsx > /tmp/i18n-tests.log 2>&1 || { tail -160 /tmp/i18n-tests.log; exit 1; }
          tail -12 /tmp/i18n-tests.log
