name: Localization source review

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/i18n-review.yml'
      - 'scripts/audit-localization.mjs'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [catalog, shared, outbound, inbound, inventory, reports, master-data, auth, receiving, putaway, warranty, iam, notifications, audit-logs, errors]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install parser only (no repository dependencies changed)
        run: |
          npm install --prefix "$RUNNER_TEMP/i18n-parser" typescript@6.0.2 --ignore-scripts --no-audit --no-fund
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/i18n-parser/node_modules/typescript" node_modules/typescript
      - name: Audit interface literals and catalog coverage
        env:
          REVIEW_GROUP: ${{ matrix.group }}
        run: node scripts/audit-localization.mjs "$REVIEW_GROUP"
