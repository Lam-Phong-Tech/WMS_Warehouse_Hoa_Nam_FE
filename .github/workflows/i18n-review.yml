name: Localization source review

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/i18n-review.yml'
      - 'scripts/localize-interface.mjs'
      - 'scripts/i18n-reviewed-translations.tsv'
      - 'src/shared/i18n/**'

permissions:
  contents: read

concurrency:
  group: localization-source-review-dev
  cancel-in-progress: true

env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-i18n
  VITE_API_BASE_URL: http://127.0.0.1:5173/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: '10000'
  VITE_API_WITH_CREDENTIALS: 'true'
  VITE_STORAGE_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'
  VITE_ENABLE_DEBUG: 'false'
  VITE_ENABLE_PERF_MONITOR: 'false'

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Apply reviewed translations in the temporary checkout only
        run: node scripts/localize-interface.mjs --apply
      - name: Format only localization changes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const changed = execFileSync('git', ['diff', '--name-only', '-z']).toString().split('\0');
          const added = execFileSync('git', ['ls-files', '--others', '--exclude-standard', '-z']).toString().split('\0');
          const paths = [...new Set([...changed, ...added, 'src/shared/i18n/EnglishLanguageBoundary.tsx', 'src/shared/i18n/EnglishLanguageBoundary.test.tsx', 'src/shared/i18n/english-coverage.test.ts', 'src/shared/i18n/english-messages.ts', 'src/shared/i18n/english-language-boundary.css', 'src/App.tsx'])].filter(p => p.startsWith('src/') && /\.(ts|tsx|css)$/.test(p) && fs.existsSync(p));
          execFileSync('node_modules/.bin/prettier', ['--write', ...paths], {stdio:'inherit'});
          execFileSync('git', ['diff', '--check'], {stdio:'inherit'});
          execFileSync('git', ['diff', '--stat'], {stdio:'inherit'});
          JS
      - name: Type check translated application
        run: npm run typecheck
      - name: Translation and changed-screen regression tests
        if: ${{ !cancelled() }}
        run: npm run test -- src/shared/i18n src/modules/inbound src/modules/outbound src/modules/reports src/modules/master-data src/app/layouts src/shared/constants/business-labels.test.ts
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
