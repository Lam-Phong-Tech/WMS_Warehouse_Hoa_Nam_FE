name: Non-report API final validation
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/nonreport-api-finalize.yml']
permissions:
  contents: write
concurrency:
  group: nonreport-api-finalize
  cancel-in-progress: true
env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-nonreport-audit
  VITE_API_BASE_URL: http://127.0.0.1:5197/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: '10000'
  VITE_API_WITH_CREDENTIALS: 'true'
  VITE_STORAGE_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'
  VITE_ENABLE_DEBUG: 'false'
  VITE_ENABLE_PERF_MONITOR: 'false'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive > /tmp/install.log 2>&1 || { tail -40 /tmp/install.log; exit 1; }
      - name: Apply reviewed corrections with source guards
        id: patch
        run: |
          node scripts/nonreport-api-audit/patch.mjs
          node scripts/nonreport-api-audit/patch-extra.mjs
          node scripts/nonreport-api-audit/patch-flows.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';import cp from 'node:child_process';import assert from 'node:assert/strict';import crypto from 'node:crypto';import ts from 'typescript';
          const safety=fs.readFileSync('.github/workflows/nonreport-api-safety.yml','utf8');
          const safetySha=crypto.createHash('sha1').update('blob '+Buffer.byteLength(safety)+'\0').update(safety).digest('hex');
          assert.equal(safetySha,'6f0d501003e27ada515cd050874961b7d11c226f');
          const blocks=[...safety.matchAll(/node --input-type=module <<'JS'\n([\s\S]*?)\n          JS/g)];
          assert.equal(blocks.length,2);const reviewed=blocks[0][1].split('\n').map(x=>x.replace(/^ {10}/,'')).join('\n');
          cp.execFileSync(process.execPath,['--input-type=module'],{input:reviewed,stdio:['pipe','inherit','inherit']});
          const changed=new Set(JSON.parse(fs.readFileSync('/tmp/nonreport-changed.json','utf8')));
          function parse(source,path){return ts.createSourceFile(path,source,ts.ScriptTarget.Latest,true);}
          function editNodes(source,path,predicate,replacement,count){const sf=parse(source,path),nodes=[];const visit=n=>{if(predicate(n,sf)){nodes.push(n);return;}ts.forEachChild(n,visit);};visit(sf);assert.equal(nodes.length,count,path);for(const n of nodes.sort((a,b)=>b.pos-a.pos))source=source.slice(0,n.getStart(sf))+replacement+source.slice(n.end);return source;}
          function put(path,source){assert(!path.includes('/reports/'));assert.equal(parse(source,path).parseDiagnostics.length,0);fs.writeFileSync(path,source);changed.add(path);}
          const types='src/modules/inbound/types/index.ts';let source=fs.readFileSync(types,'utf8');
          assert.equal(crypto.createHash('sha1').update('blob '+Buffer.byteLength(source)+'\0').update(source).digest('hex'),'83bbd819870a0ce42c585f1a580da123595ffebd');
          source=editNodes(source,types,(n,f)=>ts.isPropertySignature(n)&&n.name.getText(f)==='version'&&ts.isInterfaceDeclaration(n.parent)&&n.parent.name.text==='InboundDocument','version?: number;',1);
          source=editNodes(source,types,(n,f)=>ts.isPropertySignature(n)&&n.name.getText(f)==='document'&&ts.isInterfaceDeclaration(n.parent)&&n.parent.name.text==='InboundDetail','document: InboundDocument & { version: number };',1);put(types,source);
          const service='src/modules/inbound/services/inboundService.ts';source=fs.readFileSync(service,'utf8');
          source='import { nullableApiNumber } from "@/shared/api/api-read-values";\n'+source;
          source=editNodes(source,service,(n,f)=>ts.isPropertyAssignment(n)&&n.name.getText(f)==='version'&&n.initializer.getText(f).includes('"inbound.version"'),'version: nullableApiNumber(row.version ?? row.lock_version) ?? undefined',1);
          const anchor='const document = normalizeDocument(row);';assert.equal(source.split(anchor).length-1,1);
          source=source.replace(anchor,'const document = { ...normalizeDocument(row), version: requirePositiveNumber(row.version ?? row.lock_version, "inbound.version") };');
          source=source.replace('import { requiredApiNumber } from "@/shared/api/api-read-values";\n','');
          put(service,source);fs.writeFileSync('/tmp/nonreport-changed.json',JSON.stringify([...changed]));
          cp.execFileSync('node_modules/.bin/prettier',['--write',...changed],{stdio:'inherit'});
          JS
          git diff --check
          test -z "$(git diff --name-only -- src/modules/reports)"
      - name: Typecheck all consumers
        id: types
        run: npm run typecheck
      - name: Build exact candidate
        id: build
        run: npm run build > /tmp/build.log 2>&1 || { tail -80 /tmp/build.log; exit 1; }
      - name: Execute all non-report regression tests
        id: tests
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        run: |
          rm -f test-results/vitest-results.json
          npm run test -- src/modules src/shared/api src/shared/ui/catalog --exclude 'src/modules/reports/**' --maxWorkers=2 > /tmp/tests.log 2>&1 || true
          test -f test-results/vitest-results.json || { tail -60 /tmp/tests.log; exit 1; }
          python3 - <<'PY'
          import json
          r=json.load(open('test-results/vitest-results.json'))
          print('FINAL_TEST_TOTALS',{k:r.get(k) for k in ['numTotalTests','numPassedTests','numFailedTests','numRuntimeErrorTestSuites']})
          for suite in r['testResults']:
            for test in suite.get('assertionResults',[]):
              if test['status']=='failed': print('FINAL_FAILURE',suite['name'],test['fullName'],str(test.get('failureMessages',[]))[:500])
          if r.get('numFailedTests',0) or r.get('numRuntimeErrorTestSuites',0): raise SystemExit(1)
          PY
      - name: Preserve reviewed source tree and truthful test outcome without updating any ref
        if: ${{ !cancelled() && steps.types.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import cp from 'node:child_process';import assert from 'node:assert/strict';
          const paths=JSON.parse(fs.readFileSync('/tmp/nonreport-changed.json','utf8'));assert(paths.every(p=>p.startsWith('src/')&&!p.includes('/reports/')));
          const base=cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/trees`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({base_tree:base,tree:paths.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}))})});
          if(!r.ok)throw Error(`Git tree creation failed: ${r.status}`);const tree=await r.json();
          console.log('REVIEWED_SOURCE_TREE',JSON.stringify({tree:tree.sha,parent:process.env.GITHUB_SHA,tests:process.env.TEST_OUTCOME,paths}));cp.execFileSync('git',['diff','--stat'],{stdio:'inherit'});
          JS
