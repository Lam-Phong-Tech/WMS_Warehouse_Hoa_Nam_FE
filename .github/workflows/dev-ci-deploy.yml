name: DEV frontend test and deploy

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint, typecheck, Vitest, build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      SOURCE_SHA: ${{ github.sha }}
      EXECUTION_SHA: ${{ github.sha }}
      VITE_APP_ENV: dev
      VITE_APP_VERSION: 1.0.0+dev.${{ github.run_number }}
      VITE_API_BASE_URL: https://khohoanamfe.lptech.info.vn/api/v1
      VITE_API_HEALTH_PATH: /health
      VITE_API_TIMEOUT_MS: '30000'
      VITE_API_WITH_CREDENTIALS: 'true'
      VITE_STORAGE_URL: ''
      VITE_SCANNER_KIOSK_MODE: 'true'
      VITE_RUM_SAMPLE_RATE: '0'
      VITE_REVERB_APP_KEY: ''
      VITE_TEMP_AUTO_LOGIN: 'false'
      VITE_ENABLE_ANALYTICS: 'false'
      VITE_ENABLE_DEBUG: 'false'
      VITE_ENABLE_PERF_MONITOR: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Run the repository test command
        run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Build deployable artifact
        run: pnpm build
      - name: Bind DEV health to the tested SHA
        run: node scripts/write-dev-health.mjs
      - name: Check build health
        run: pnpm health:check
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        with:
          name: frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy tested frontend SHA to DEV VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: DEV
    steps:
      - name: Refuse a superseded dev commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/dev --jq .object.sha)"
          test "$head" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: dist
      - name: Check artifact SHA and deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY_FE }}
          KNOWN_HOSTS: ${{ secrets.DEV_DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/dev --jq .object.sha)"
          test "$head" = "$GITHUB_SHA"
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          jq -e --arg sha "$GITHUB_SHA" \
            '.sourceSha == $sha and .environment == "dev"' dist/build-manifest.json
          tar -C dist -czf "$RUNNER_TEMP/frontend.tar.gz" .
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/hoanam-dev"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hoanam-dev" "$HOME/.ssh/known_hosts"
          { printf '%s\n' "$GITHUB_SHA"; cat "$RUNNER_TEMP/frontend.tar.gz"; } |
            ssh -i "$HOME/.ssh/hoanam-dev" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes root@14.225.37.158
      - name: Verify public frontend manifest
        shell: bash
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://khohoanamfe.lptech.info.vn/build-manifest.json | jq -r .sourceSha)"
          test "$actual" = "$GITHUB_SHA"
