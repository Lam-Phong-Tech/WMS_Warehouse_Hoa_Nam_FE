name: Refactor inbound module architecture

on:
  push:
    branches: [m1]
    paths:
      - '.github/workflows/refactor-inbound-module.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1
          fetch-depth: 0
      - name: Verify and repair module-local inbound boundaries
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          page_path = Path('src/modules/inbound/pages/InboundPage.tsx')
          page = page_path.read_text().replace(
              'InboundInboundDraftFormValues',
              'InboundDraftFormValues',
          )
          if 'from "zod"' in page or 'const inboundLineSchema' in page:
              raise SystemExit('InboundPage still owns an inline Zod schema')
          if '@/modules/receiving/types' in page:
              raise SystemExit('InboundPage still imports legacy receiving types')
          page_path.write_text(page)

          hook_path = Path('src/modules/inbound/hooks/use-inbound.ts')
          hook = hook_path.read_text()
          if '@/modules/receiving/' in hook:
              raise SystemExit('Inbound hook still imports legacy receiving module')

          screen_path = Path('src/modules/inbound/pages/MvpInboundScreens.tsx')
          screen = screen_path.read_text()
          if '@/modules/receiving/types' in screen:
              raise SystemExit('Inbound screens still import legacy receiving types')
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/inbound
          git commit -m "fix(inbound): correct extracted form type"
          git push origin HEAD:m1
