name: Non-report API recheck
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/nonreport-api-recheck.yml', 'scripts/nonreport-api-audit/recheck-20260924.mjs']
permissions:
  contents: write
concurrency:
  group: nonreport-api-recheck
  cancel-in-progress: true
env:
  VITE_APP_ENV: test
  VITE_APP_VERSION: 1.0.0-nonreport-recheck
  VITE_API_BASE_URL: http://127.0.0.1:5197/api/v1
  VITE_API_HEALTH_PATH: /health
  VITE_API_TIMEOUT_MS: '10000'
  VITE_API_WITH_CREDENTIALS: 'true'
  VITE_STORAGE_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'
  VITE_ENABLE_DEBUG: 'false'
  VITE_ENABLE_PERF_MONITOR: 'false'
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive > /tmp/install.log 2>&1 || { tail -40 /tmp/install.log; exit 1; }
      - name: Apply guarded corrections in validation workspace
        id: patch
        run: node scripts/nonreport-api-audit/recheck-20260924.mjs
      - name: Typecheck every consumer
        id: types
        run: npm run typecheck
      - name: Build complete application
        id: build
        run: npm run build > /tmp/build.log 2>&1 || { tail -80 /tmp/build.log; exit 1; }
      - name: Run all non-report tests preserving the exit code
        id: tests
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        run: |
          rm -f test-results/vitest-results.json
          set +e
          npm run test -- src/modules src/shared/api src/shared/ui/catalog --exclude 'src/modules/reports/**' --maxWorkers=2 > /tmp/tests.log 2>&1
          code=$?
          set -e
          python3 - <<'PY'
          import json,os
          p='test-results/vitest-results.json'
          if not os.path.exists(p):
            print(open('/tmp/tests.log').read()[-8000:]);raise SystemExit(1)
          r=json.load(open(p))
          print('RECHECK_TOTALS',{k:r.get(k) for k in ['numTotalTests','numPassedTests','numFailedTests','numRuntimeErrorTestSuites']})
          for suite in r['testResults']:
            for test in suite.get('assertionResults',[]):
              if test['status']=='failed': print('RECHECK_FAILURE',suite['name'],test['fullName'],str(test.get('failureMessages',[]))[:900])
          PY
          exit "$code"
      - name: Preserve candidate for review without updating a branch
        if: ${{ !cancelled() && steps.types.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import cp from 'node:child_process';import assert from 'node:assert/strict';
          const paths=JSON.parse(fs.readFileSync('/tmp/nonreport-recheck-paths.json','utf8'));
          assert(paths.every(p=>p.startsWith('src/')&&!p.includes('/reports/')));
          const base=cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/trees`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({base_tree:base,tree:paths.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}))})});
          if(!response.ok)throw Error(`Git tree creation failed: ${response.status}`);
          const tree=await response.json();console.log('RECHECK_TREE',JSON.stringify({tree:tree.sha,parent:process.env.GITHUB_SHA,tests:process.env.TEST_OUTCOME,paths}));
          cp.execFileSync('git',['diff','--stat'],{stdio:'inherit'});
          JS
