# Include inside the HTTPS server for khohoanamfe.lptech.info.vn.
# This frontend's observed upstream is 127.0.0.1:18083. Keep its existing
# location / and /app/ proxies intact; never include in the API server.
location ^~ /assets/ {
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript text/javascript text/css;

    proxy_pass http://127.0.0.1:18083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
}
